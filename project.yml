# Project metadata — single source of truth for every project-specific
# string that the build scripts (build_report.py, build_docx.py,
# build_reference_docx.py, publish_pages.py) inject into the HTML, DOCX,
# PDF, and GitHub Pages output.
#
# WHEN YOU SEED A NEW PROJECT:
#   1. seed_project.py renames project_TEMPLATE.yml → project.yml on copy.
#   2. Edit project.yml below; replace every <PLACEHOLDER> with your
#      project's real metadata before running the build pipeline.
#   3. The build scripts fail loudly if project.yml is missing, so this
#      step cannot be silently skipped.

project:
  # Primary report title. Used as the HTML <title>, the sticky-header
  # banner, the DOCX cover Title style, and (joined with subtitle) as
  # the published <title> on the GitHub Pages index.
  title: "Responsible AI in Academic Research"

  # Subtitle / strapline. May be empty for projects without a subtitle.
  subtitle: "A Capability Framework for Research Training"

  # Short title for running header / sticky header (DOCX header,
  # build_reference_docx.py). Often a lowercase or terser variant
  # since it has to fit a single header line.
  short_title: "Responsible AI in research training"

  # Series brand. Appears in the sticky-header meta line, DOCX running
  # head, and (uppercased) on the printed cover kicker.
  series: "Instats Policy Series"

  # Uppercase kicker variant for cover/section kickers.
  series_kicker: "INSTATS POLICY SERIES"

  # Public report identifier carried in the cover's bottom blue band.
  # Format: <SERIES-CODE>-<YEAR>-<SEQ>, optionally followed by " · ISSN ...".
  # Leave empty for early working drafts.
  report_id: "INSTATS-PS-2026-04"

  # Human-readable publication date (Month YYYY). Free-text — not parsed
  # by the formatters; surfaces in the colophon / about-block of the
  # markdown source.
  date_display: "May 2026"

  # Lead author byline.
  author: "Michael J. Zyphur, PhD"

  # Author affiliation (institution / department).
  author_affiliation: "Instats"

  # Author bio long-form (v0.22.26+). One sentence, role+institution.
  author_bio: "Director of Instats; Professor of Quantitative Methods at the University of Queensland"

  # Public author homepage / Google Scholar / ORCID profile URL
  # (v0.22.26+).
  author_url: "https://scholar.google.com/citations?user=J2VA-RMAAAAJ&hl=en"

  # One-sentence headline finding for the web hero block (v0.22.26+).
  headline_finding: "Of thirty-eight top-tier doctoral universities surveyed across fifteen countries, only six have AI policies that extend past research integrity into AI literacy and valid research practice — while publishers issued a no-AI-co-author rule sector-wide within ten weeks of ChatGPT's release."

  # Contact email for footer / colophon and DOCX core properties.
  contact_email: "support@instats.org"

  # GitHub repository URL (front matter for README badges and citation
  # blocks). May be empty for projects not yet pushed.
  github_url: "https://github.com/mzyphur/responsible-ai-in-research-training"

  # GitHub Pages URL the published HTML lives at. Used as og:url and
  # in the publish_pages.py "Site:" deploy banner.
  pages_url: "https://mzyphur.github.io/responsible-ai-in-research-training/"

  # Filename of the printable PDF. Keep this as report.pdf: build_pdf.py
  # writes final/report.pdf and publish_pages.py copies it to docs/report.pdf.
  # The field exists so HTML builders can read one canonical value, not so
  # individual projects can rename the PDF without changing the pipeline.
  pdf_filename: "report.pdf"

  # One-sentence description for the <meta name="description"> tag and
  # the social-card og:description.
  description: "What does responsible AI use look like in PhD-level research and research training? A capability framework benchmarking institutional AI policy, AI-literacy, validation, and reproducibility, with international comparators."

  # Social card title (og:title, twitter:title). Often "<title> — <series>"
  # but kept explicit so projects can shorten or rephrase for sharing.
  og_title: "Responsible AI in Academic Research — Instats Policy Series"

  # Social card description (og:description).
  og_description: "A global capability framework for senior university research leadership: what responsible AI use looks like in PhD-level research and research training, with international comparators."

  # Word "Properties" Subject field — populates `dc:subject` in the DOCX
  # core properties via pandoc --metadata subject=...
  docx_subject: "Public policy analysis — responsible AI use in research and research training"

  # Word "Properties" Keywords field — pandoc --metadata keywords=...
  # Comma-separated topic keywords for archival search.
  docx_keywords: "AI policy, research training, PhD research, university leadership, capability framework, responsible AI, AI literacy, research integrity"

  # If set, the build pipeline emits an additional HTML variant at
  # `docs/index.instats.html` where every relative asset URL is rewritten
  # to an absolute URL prefixed by `absolute_asset_base` (typically the
  # project's GitHub Pages URL). The instats.org publication page at
  # `<instats_publication_url>` can drop in this HTML and render the
  # report with assets served from GitHub Pages' CDN.
  # Use this as a full report embed on a dedicated host page. It strips
  # fixed report chrome but still carries scoped report-level CSS and a
  # static PDF download action;
  # do not paste it inline into a mixed host page with unrelated content.
  #
  # If either key is unset/absent, the absurl variant is NOT emitted —
  # back-compatible for projects without hosting plans.
  instats_publication_url: "https://instats.org/publications/responsible-ai-in-research-training/"
  absolute_asset_base: "https://mzyphur.github.io/responsible-ai-in-research-training/"
