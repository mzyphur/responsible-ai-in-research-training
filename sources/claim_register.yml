# Public claim/source register for <PROJECT>.
#
# Purpose:
#   Give skeptical public readers a structured path from report claim
#   -> source -> manifest value -> chart/release metadata without exposing
#   Instats' private production workflow.
#
# Every headline_check entry in data/values.yml must resolve to:
#   - a claim_id below;
#   - a source_id below;
#   - an uncertainty_status matching the claim record.

claims:
  - claim_id: CLM-001
    claim_text: "<Exact headline claim or stable paraphrase>"
    claim_type: descriptive
    report_location: "drafts/report.md:<line-or-section>"
    value_key: "headline_revenues_aud_bn.instrument_a"
    chart_id: "figure-1"
    source_ids: ["SRC-001"]
    verification_status: verified
    uncertainty_status: direct_source
    version_introduced: "0.1.0"
    version_changed: null
    notes: "Replace with public audit notes, not private review mechanics."

sources:
  - source_id: SRC-001
    publisher: "<publisher>"
    title: "<source title>"
    url: "https://example.org/source"
    archive_url: null
    accessed_date: "YYYY-MM-DD"
    page_or_table: "<page/table/section>"
    source_status: primary_official
    notes: "Public source metadata only."

allowed_status_values:
  claim_type:
    - descriptive
    - comparative
    - causal
    - illustrative
    - normative
    - recommendation
  verification_status:
    - verified
    - verified_with_caveat
    - unverified_excluded
  uncertainty_status:
    - direct_source
    - derived_calculation
    - indicative
    - scenario
    - disputed
    - synthetic_fixture
  source_status:
    - primary_official
    - official_secondary
    - academic
    - ngo_analysis
    - media
    - archive
    - unverified_to_primary
    - calculation_by_author
